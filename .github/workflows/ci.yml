name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  sdk:
    name: SDK - Lint, Type Check, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm run build
      - name: Verify package contents
        run: npm pack --dry-run

  demo:
    name: Demo - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/sdk
      - name: XYZ Bank - test, build, and check the committed build is current
        run: |
          npm run test -w packages/xyz-bank
          npm run build -w packages/xyz-bank
          git diff --exit-code --stat -- packages/demo/public/xyz || (echo "packages/demo/public/xyz is stale: run npm run build:xyz and commit it" && exit 1)
      - run: npm run build -w packages/demo
